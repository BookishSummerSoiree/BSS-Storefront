/* ---- Group signing flow: used when several DIFFERENT books are added
   together (whole series, or a few picked from the series list). One
   shared signed/personalized decision and name for the whole group. ---- */
let _groupSwagIds = new Set();
function startGroupSigningFlow(books, presetSwag){
  _groupSwagIds = new Set();
  // Series-set pricing: if every book came from the same series and that
  // series has its own set price, prorate it across the books so the line
  // items sum to exactly the set price (last item absorbs rounding).
  const allSameSeries = books.length > 0 && books.every(b => b.isSeries && b.seriesName === books[0].seriesName && b.author === books[0].author) && books.length === seriesSiblings(books[0]).length;   // the series price only applies to the complete series, not a few of its books
  let prices = books.map(b => effectivePrice(b));
  if(allSameSeries){
    const setPrice = seriesEffectivePrice(books[0]);
    if(setPrice !== null){
      // Split the set price across the books in proportion to what each book
      // costs on its own ($10 + $20 sold as a $27 set -> $9 + $18), so a
      // bigger, pricier book earns its fair share. The last book absorbs
      // any rounding cents so the lines add up to exactly the set price.
      const totalCents = Math.round(setPrice * 100);
      const weights = books.map(b => Math.max(0, effectivePrice(b)));
      const wSum = weights.reduce((x,y) => x + y, 0);
      let used = 0;
      prices = books.map((b,i) => {
        let c;
        if(i === books.length-1) c = totalCents - used;
        else c = wSum > 0 ? Math.floor(totalCents * weights[i] / wSum) : Math.floor(totalCents / books.length);
        used += c;
        return c / 100;
      });
    }
  }
  const setTotal = prices.reduce((a,b) => a + b, 0);
  const seriesNameEsc = escapeHtml(books[0].seriesName || "");
  const _gSwagN = presetSwag ? books.filter(b => bookSwagOffered(b) && presetSwag.has(b.id)).length : 0;
  const _gSwagAmt = presetSwag ? books.filter(b => bookSwagOffered(b) && presetSwag.has(b.id)).reduce((t,b) => t + parseFloat(b.swagPrice), 0) : 0;
  const _gSwagAll = _gSwagN > 0 && _gSwagN >= books.filter(bookSwagOffered).length;
  const _gSwagTxt = !_gSwagN ? "" : (allSameSeries ? (_gSwagAll ? " + series swag pack" : ` + ${_gSwagN} swag pack${_gSwagN === 1 ? "" : "s"}`) : ` + ${_gSwagN} swag pack${_gSwagN === 1 ? "" : "s"}`);

  // First question: how many copies of the whole series / group? Each copy
  // is its own set (its own series row in the cart), so one set can be
  // signed or personalized differently from another.
  let qty = 1;
  openModal(`
    <div class="eyebrow">${seriesNameEsc}</div>
    <div class="modal-title">${allSameSeries ? escapeHtml(seriesLabel(books[0].seriesName || "")) : "These " + books.length + " books"}${_gSwagTxt}</div>
    <div class="modal-sub">${books.length} ${books.length === 1 ? "book" : "books"} \u2014 ${money(setTotal + _gSwagAmt)} per ${allSameSeries ? "series" : "set"}</div>
    <div class="field">
      <label>${allSameSeries ? "How many copies of this series do you want?" : "How many copies of this group of books?"}</label>
      <div class="qty-stepper">
        <button id="gqMinus">&minus;</button>
        <span class="qty-val" id="gqVal">1</span>
        <button id="gqPlus">+</button>
      </div>
      <div class="help">Each copy includes ${books.length === 1 ? "the 1 book" : "all " + books.length + " books"}${allSameSeries ? " in the series so far" : ""}.</div>
    </div>
    <button class="btn btn-primary btn-block" id="gqNextBtn">Next</button>
  `, (card)=>{
    const val = card.querySelector('#gqVal');
    card.querySelector('#gqMinus').onclick = () => { qty = Math.max(1, qty-1); val.textContent = qty; };
    card.querySelector('#gqPlus').onclick = () => { qty = Math.min(20, qty+1); val.textContent = qty; };
    card.querySelector('#gqNextBtn').onclick = () => {
      closeModal();
      _groupSwagIds = new Set();
      const swagBooks = books.filter(bookSwagOffered);
      if(!swagBooks.length){ groupSignedQuestion(books, prices, qty); return; }
      // The swag packs were already chosen on the series screen: no second question.
      if(presetSwag){ _groupSwagIds = new Set(books.filter(b => presetSwag.has(b.id)).map(b => b.id)); groupSignedQuestion(books, prices, qty); return; }
      const n = swagBooks.length;
      const rows = swagBooks.map((b,i) => `
        <label class="series-list-item" style="align-items:center;">
          <input type="checkbox" data-i="${i}"${swagPicks.has(b.id) ? " checked" : ""}>
          <span style="flex:1;">${escapeHtml(b.title)}${b.seriesBookNumber ? ` <span style="opacity:.6;font-size:12px;">(Book ${escapeHtml(b.seriesBookNumber)})</span>` : ""}</span>
          <span style="font-weight:700;font-size:13px;">+${money(parseFloat(b.swagPrice))}</span>
        </label>`).join("");
      openModal(`
        <div class="eyebrow">${seriesNameEsc}</div>
        <div class="modal-title">Swag Packs</div>
        <div class="modal-sub">${n === 1 ? "1 of the " + books.length + " books" : n + " of the " + books.length + " books"} in ${allSameSeries ? "this series" : "this group"} ${n === 1 ? "has a Swag Pack" : "have Swag Packs"} available. Check the ones you\u2019d like to add.</div>
        <div style="margin:0 0 12px;">${rows}</div>
        <div style="margin:0 0 14px;font-size:12px;font-style:italic;line-height:1.4;opacity:.85;">The swag pack for this book could include: stickers, bookmark, magnet, or other items. Contact author for specific content.</div>
        <div id="gSwagTotal" style="margin:0 0 14px;font-size:14px;font-weight:600;"></div>
        <button class="btn btn-primary btn-block" id="gSwagGo">Continue</button>
      `, (cs)=>{
        const boxes = Array.from(cs.querySelectorAll('input[type="checkbox"]'));
        const chosen = () => boxes.filter(x => x.checked).map(x => swagBooks[parseInt(x.dataset.i,10)]);
        const refresh = () => {
          const sw = chosen().reduce((t,b) => t + parseFloat(b.swagPrice), 0);
          cs.querySelector('#gSwagTotal').textContent = sw > 0
            ? (allSameSeries ? "Series " : "Books ") + money(setTotal) + " + Swag Packs " + money(sw) + " = " + money(setTotal + sw) + (qty > 1 ? " per set" : "")
            : "No Swag Packs added";
        };
        boxes.forEach(x => x.onchange = refresh);
        refresh();
        cs.querySelector('#gSwagGo').onclick = () => {
          _groupSwagIds = new Set(chosen().map(b => b.id));
          closeModal(); groupSignedQuestion(books, prices, qty);
        };
      });
    };
  });
}

// Builds one set of cart lines per copy (each with its own seriesGroupId).
// signedNames: one entry per SIGNED set ("" = signed but not personalized);
// any sets beyond that are unsigned.
function addGroupSets(books, prices, qty, signedNames){
  const lines = [];
  for(let n = 0; n < qty; n++){
    const groupId = 'sg_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8) + n;
    const signed = n < signedNames.length;
    const name = signed ? (signedNames[n] || "") : "";
    books.forEach((b,i) => {
      const ln = makeCartLine(b, signed, name, prices[i], groupId);
      if(_groupSwagIds.has(b.id) && bookSwagOffered(b)){ ln.swag = true; ln.swagPrice = parseFloat(b.swagPrice); }
      lines.push(ln);
    });
  }
  _groupSwagIds.forEach(id => swagPicks.delete(id));
  _groupSwagIds = new Set();
  addLinesToCart(lines);
}

function groupSignedQuestion(books, prices, qty){
  const askText = qty === 1 ? "Do you want these books signed?" : "Do you want any of these sets signed?";
  openModal(`
    <div class="modal-title">${askText}</div>
    <div class="modal-sub">${qty === 1 ? books.length + " books" : qty + " sets of " + books.length + " books"} from "${escapeHtml(books[0].seriesName || "")}".</div>
    <div class="btn-row" style="flex-direction:column;align-items:stretch;">
      <button class="btn btn-primary" id="gSignedYes">Yes</button>
      <button class="btn btn-secondary" id="gSignedNo" style="margin-top:10px;">No</button>
    </div>
  `, (card)=>{
    card.querySelector('#gSignedNo').onclick = () => { closeModal(); addGroupSets(books, prices, qty, []); };
    card.querySelector('#gSignedYes').onclick = () => {
      closeModal();
      if(qty === 1) groupPersonalizedQuestion(books, prices, qty, 1);
      else groupHowManySigned(books, prices, qty);
    };
  });
}

function groupHowManySigned(books, prices, qty){
  let howMany = qty;
  openModal(`
    <div class="modal-title">How many of the ${qty} sets would you like signed?</div>
    <div class="field">
      <div class="qty-stepper">
        <button id="ghMinus">&minus;</button>
        <span class="qty-val" id="ghVal">${qty}</span>
        <button id="ghPlus">+</button>
      </div>
      <div class="help">Out of ${qty} total sets.</div>
    </div>
    <button class="btn btn-primary btn-block" id="ghNextBtn">Next</button>
  `, (card)=>{
    const val = card.querySelector('#ghVal');
    card.querySelector('#ghMinus').onclick = () => { howMany = Math.max(1, howMany-1); val.textContent = howMany; };
    card.querySelector('#ghPlus').onclick = () => { howMany = Math.min(qty, howMany+1); val.textContent = howMany; };
    card.querySelector('#ghNextBtn').onclick = () => { closeModal(); groupPersonalizedQuestion(books, prices, qty, howMany); };
  });
}

function groupPersonalizedQuestion(books, prices, qty, signedCount){
  const askText = signedCount === 1 ? "Do you want these books personalized?" : "Do you want these sets personalized?";
  openModal(`
    <div class="modal-title">${askText}</div>
    <div class="btn-row" style="flex-direction:column;align-items:stretch;">
      <button class="btn btn-primary" id="gPersYes">Yes</button>
      <button class="btn btn-secondary" id="gPersNo" style="margin-top:10px;">No</button>
    </div>
  `, (card)=>{
    card.querySelector('#gPersNo').onclick = () => {
      closeModal();
      addGroupSets(books, prices, qty, Array.from({length: signedCount}, () => ""));
    };
    card.querySelector('#gPersYes').onclick = () => {
      closeModal();
      const ordinals = ["first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"];
      const fieldsHtml = Array.from({length: signedCount}, (_, n) => `
        <div class="field">
          <label>${signedCount === 1 ? "What name do you want in these books?" : `What name do you want in the ${ordinals[n] || (n+1)+"th"} signed set?`}</label>
          <input type="text" data-idx="${n}" placeholder="Name">
        </div>`).join("");
      openModal(`
        <div class="modal-title">Personalization</div>
        ${fieldsHtml}
        <button class="btn btn-primary btn-block" id="gNameNextBtn">Add to cart</button>
      `, (card3)=>{
        card3.querySelector('#gNameNextBtn').onclick = () => {
          const names = Array.from(card3.querySelectorAll('input[type="text"]')).map(i => i.value.trim());
          closeModal();
          addGroupSets(books, prices, qty, names);
        };
      });
    };
  });
}

function makeCartLine(book, signed, personalizedName, priceOverride, seriesGroupId, format){
  const formats = bookFormats(book);
  const fmt = format || formats[0] || "paperback";
  return {
    cartLineId: 'cl_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8),
    bookId: book.id,
    author: book.author,
    title: book.title,
    coverUrl: book.coverUrl,
    unitPrice: priceOverride !== undefined ? priceOverride : bookFormatPriceInfo(book, fmt).price,
    signed: !!signed,
    personalizedName: personalizedName || "",
    // Set only when this copy was added as part of a "whole series" / "a
    // few books from this series" group action, so the cart can show one
    // series row instead of one row per book.
    seriesGroupId: seriesGroupId || null,
    seriesName: book.seriesName || "",
    seriesCoverUrl: book.seriesHasCover === "Yes" && book.seriesCoverUrl ? book.seriesCoverUrl : "",
    // Only shown in the cart when the book actually has more than one
    // format — no point labeling "Paperback" on a book that only comes
    // one way.
    format: fmt,
    formatLabel: (formats.length > 1 || fmt === "specialEdition") ? formatLabel(fmt, book) : ""
  };
}
function makeUnsignedLines(book, count, format){
  return Array.from({length: Math.max(0,count)}, () => makeCartLine(book, false, "", undefined, undefined, format));
}

function addLinesToCart(lines){
  if(_swagNext){
    lines.forEach(l => { if(l.bookId === _swagNext.bookId && !l.seriesGroupId){ l.swag = true; l.swagPrice = _swagNext.price; } });
  }
  if(lines.length) swagPicks.delete(lines[0].bookId);
  _swagNext = null;
  cart = cart.concat(lines);
  saveCartToStorage();
  updateCartBadge();
  showToast(lines.every(l => l.swagOnly) ? (lines.length === 1 ? "Swag pack added to cart" : `Added ${lines.length} swag packs to cart`) : (lines.length === 1 ? "Added to cart" : `Added ${lines.length} books to cart`));
  // Refresh the screen so the book cards / cart show what was just added
  // (keeping the page where it was, so it doesn't jump back to the top).
  if(currentScreen === "cart" || currentScreen === "browse"){
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }
}

function removeCartLine(cartLineId){
  cart = cart.filter(l => l.cartLineId !== cartLineId);
  saveCartToStorage();
  render();
}

function cartTotal(){
  return cart.reduce((sum,l) => sum + lineAmount(l), 0);
}
/* Sales tax: every book is picked up at the Soir\u00e9e in Provo, so the whole
   order is taxed at Provo's combined rate. Must match TAX_PARTS in Code.gs
   (the server works out the real amount; this only shows it). */
const SALES_TAX_PCT = 7.45;
function cartTax(){ return Math.round(Math.round(cartTotal() * 100) * SALES_TAX_PCT / 100) / 100; }
function cartTotalWithTax(){ return Math.round((cartTotal() + cartTax()) * 100) / 100; }

/* ---- Cart grouping ----
   The cart itself stays one row per physical copy (cartLineId) — that's
   what checkout/Orders needs. Display groups those copies two levels deep:
   by book (one Amazon-style row with a combined qty +/-), then within a
   book by "variant" (signed + personalizedName) so two differently-
   personalized copies still show as their own lines underneath.
   Copies added together as a series (seriesGroupId set) are grouped into
   one series row instead, so a series shows as a single cart line rather
   than one line per book in it. */
// A series group only displays as one "Series" row while it still holds
// every book in that series. Once a book's been pulled out of it (via the
// "keep some of the books" flow, or any other way), it's no longer the
// complete set, so the remaining copies fall back to showing as individual
// books instead of a half-series row.
function isSeriesGroupComplete(seriesGroupId){
  const lines = cart.filter(l => l.seriesGroupId === seriesGroupId);
  if(lines.length === 0) return false;
  const { author, seriesName } = lines[0];
  const totalInSeries = catalog.filter(b => b.isSeries && b.author === author && b.seriesName === seriesName).length;
  if(totalInSeries === 0) return false;
  const uniqueBooks = new Set(lines.map(l => l.bookId)).size;
  return uniqueBooks >= totalInSeries;
}

function groupCartByBook(){
  const order = [];
  const map = new Map();
  cart.forEach(line=>{
    const asSeries = line.seriesGroupId && isSeriesGroupComplete(line.seriesGroupId);
    // Different formats of the same book (paperback vs. hardcover, say)
    // get their own cart row rather than being merged into one — so the
    // format is part of the grouping key, not just the book.
    const key = asSeries ? ("series:" + line.seriesGroupId) : ("book:" + line.bookId + "|" + (line.format || ""));
    if(!map.has(key)){ map.set(key, []); order.push(key); }
    map.get(key).push(line);
  });
  return order.map(key => {
    const lines = map.get(key);
    const isSeriesGroup = key.indexOf("series:") === 0;
    return {
      groupKey: key,
      bookId: lines[0].bookId,
      format: isSeriesGroup ? null : lines[0].format,
      isSeriesGroup,
      seriesGroupId: isSeriesGroup ? lines[0].seriesGroupId : null,
      lines
    };
  });
}
function variantsForLines(lines){
  const order = [];
  const map = new Map();
  lines.forEach(line=>{
    // Format is part of the variant key too, so a paperback copy and a
    // hardcover copy of the same book show as their own sub-lines instead
    // of being merged into one count.
    const key = (line.format || "") + "|" + (line.signed ? "1" : "0") + "|" + (line.personalizedName || "") + "|" + (line.swag ? "s" : "");
    if(!map.has(key)){ map.set(key, []); order.push(key); }
    map.get(key).push(line);
  });
  return order.map(key => map.get(key));
}
function variantDescriptionPlain(line){
  const prefix = line.formatLabel ? `${line.formatLabel} — ` : "";
  const swagTxt = line.swag ? " + Swag pack" : "";
  if(line.signed && line.personalizedName) return `${prefix}Signed — personalized to "${line.personalizedName}"${swagTxt}`;
  if(line.signed) return `${prefix}Signed${swagTxt}`;
  return `${prefix}Not signed${swagTxt}`;
}

// "+" on a book's cart row adds exactly one new copy, and a new copy is a
// fresh decision — so it goes through the same signed/personalized
// question flow as adding it from Browse, just skipping the "how many"
// step since this is always +1. A row on the Cart page is already pinned
// to one format (each format gets its own row there), so its "+" passes
// that format straight through with no need to ask again; the Browse
// grid's combined "+" (no format passed) still asks, same as a fresh add.
function incrementBookInCart(bookId, format){
  if(String(bookId).endsWith("::swag")){
    const ex = cart.find(l => l.bookId === bookId);
    if(!ex) return;
    cart.push(Object.assign({}, ex, { cartLineId: 'cl_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8) }));
    saveCartToStorage(); updateCartBadge(); render();
    return;
  }
  let book = catalog.find(b => b.id === bookId);
  if(!book){
    const existing = cart.find(l => l.bookId === bookId && (!format || l.format === format));
    if(!existing) return;
    // Catalog not loaded (or the book's been pulled) — fall back to what
    // the existing cart line already knows, so the flow still has a
    // title/author/cover/price to show.
    book = { id: bookId, author: existing.author, title: existing.title, coverUrl: existing.coverUrl, regularPrice: existing.unitPrice, soireePrice: "" };
  }
  {
    const prev = cart.filter(l => l.bookId === bookId && (!format || l.format === format) && !l.seriesGroupId).pop();
    _swagNext = (prev && prev.swag) ? { bookId: bookId, price: parseFloat(prev.swagPrice) } : null;
  }
  if(format){
    openSignedQuestion(book, 1, format);
  }else{
    openFormatQuestion(book, (fmt) => openSignedQuestion(book, 1, fmt));
  }
}

// "-" on a book's cart row: if every copy of that book (in that format,
// when called from a Cart page row) is identical (same signed/
// personalization), just drop one — it doesn't matter which. If there's
// more than one variant, which copy to remove is genuinely ambiguous, so
// ask.
function decrementBookInCart(bookId, format){
  // Excludes copies that are part of a still-complete series group — those
  // are managed via the series row's own remove flow, not this stepper.
  const lines = cart.filter(l => l.bookId === bookId && (!format || l.format === format) && !(l.seriesGroupId && isSeriesGroupComplete(l.seriesGroupId)));
  if(lines.length === 0) return;
  const variantGroups = variantsForLines(lines);
  if(variantGroups.length === 1){
    const vLines = variantGroups[0];
    removeCartLine(vLines[vLines.length - 1].cartLineId);
    return;
  }
  openRemoveWhichVariantModal(bookId, variantGroups);
}

function openRemoveWhichVariantModal(bookId, variantGroups){
  const first = cart.find(l => l.bookId === bookId);
  const optionsHtml = variantGroups.map((vLines,i)=>{
    const countSuffix = vLines.length > 1 ? ` (${vLines.length})` : "";
    return `<div class="radio-option" data-vi="${i}"><span>${escapeHtml(variantDescriptionPlain(vLines[0]))}${countSuffix}</span></div>`;
  }).join("");

  // Mirrors the exact phrasing when every variant is a named
  // personalization ("Are you deleting the personalized copy for Ann or
  // Nicole?"); falls back to a plainer prompt for a mixed set (e.g. one
  // unsigned copy plus a personalized one).
  const allNamed = variantGroups.every(vLines => vLines[0].personalizedName);
  const questionText = allNamed
    ? `Are you deleting the personalized copy for ${variantGroups.map(v => `"${v[0].personalizedName}"`).join(" or ")}?`
    : "Which copy would you like to remove?";

  openModal(`
    <div class="eyebrow">${escapeHtml(first ? first.title : "")}</div>
    <div class="modal-title">${questionText}</div>
    <div class="radio-group">${optionsHtml}</div>
  `, (card)=>{
    card.querySelectorAll('.radio-option').forEach(el=>{
      el.onclick = () => {
        const vLines = variantGroups[parseInt(el.dataset.vi, 10)];
        const toRemove = vLines[vLines.length - 1];
        closeModal();
        removeCartLine(toRemove.cartLineId);
      };
    });
  });
}

/* ---- Removing from a series row ----
   "Remove series" asks whether to drop the whole set or just some of the
   books. Keeping some pulls those copies out of the group entirely (they
   display as ordinary individual books from then on, per
   isSeriesGroupComplete), with a trash icon per book and an "Update cart"
   button to commit the change. */
function openSeriesRemoveChoiceModal(group){
  const seriesName = group.lines[0].seriesName || group.lines[0].title;
  openModal(`
    <div class="eyebrow">${escapeHtml(seriesName)}</div>
    <div class="modal-title">Do you want to remove the entire series?</div>
    <div class="modal-sub">Or keep some of the books and only remove a few.</div>
    <div class="radio-group">
      <div class="radio-option" id="optRemoveAll"><span>Remove the entire series</span></div>
      <div class="radio-option" id="optKeepSome"><span>Keep some of the books</span></div>
    </div>
  `, (card)=>{
    card.querySelector('#optRemoveAll').onclick = () => {
      closeModal();
      cart = cart.filter(l => l.seriesGroupId !== group.seriesGroupId);
      saveCartToStorage();
      render();
    };
    card.querySelector('#optKeepSome').onclick = () => {
      closeModal();
      openSeriesKeepSomeModal(group);
    };
  });
}

function openSeriesKeepSomeModal(group){
  const seriesName = group.lines[0].seriesName || "";
  const removedIds = new Set();
  const itemsHtml = group.lines.map(line => `
    <div class="keep-list-item" data-lineid="${line.cartLineId}">
      ${line.coverUrl ? `<img src="${coverSrc(line.coverUrl)}" alt="">` : `<div style="width:36px;height:52px;background:var(--cream);border-radius:4px;flex-shrink:0;"></div>`}
      <div class="keep-item-info">
        <div class="keep-item-title">${escapeHtml(line.title)}</div>
        <div class="keep-item-meta">${escapeHtml(variantDescriptionPlain(line))}</div>
      </div>
      <button type="button" class="keep-trash-btn" title="Remove this book">&#128465;</button>
    </div>
  `).join("");

  openModal(`
    <div class="eyebrow">${escapeHtml(seriesName)}</div>
    <div class="modal-title">Which books do you want to keep?</div>
    <div class="modal-sub">Tap the trash icon to remove a book, then update your cart.</div>
    <div class="keep-list">${itemsHtml}</div>
    <button class="btn btn-primary btn-block" id="updateCartBtn">Update cart</button>
  `, (card)=>{
    card.querySelectorAll('.keep-list-item').forEach(itemEl=>{
      itemEl.querySelector('.keep-trash-btn').onclick = () => {
        const lineId = itemEl.dataset.lineid;
        if(removedIds.has(lineId)){
          removedIds.delete(lineId);
          itemEl.classList.remove('removed');
        }else{
          removedIds.add(lineId);
          itemEl.classList.add('removed');
        }
      };
    });
    card.querySelector('#updateCartBtn').onclick = () => {
      closeModal();
      if(removedIds.size === 0) return;
      cart = cart.filter(l => !removedIds.has(l.cartLineId));
      saveCartToStorage();
      render();
    };
  });
}

/* =========================================================
   CART
========================================================= */
function renderCart(app){
  const heading = document.createElement('div');
  heading.className = "modal-title";
  heading.style.marginBottom = "16px";
  heading.textContent = "Your cart";
  app.appendChild(heading);

  if(cart.length === 0){
    app.innerHTML += `<div class="empty-state">Your cart is empty.<br><br></div>`;
    const browseBtn = document.createElement('button');
    browseBtn.className = "btn btn-primary";
    browseBtn.textContent = "Browse books";
    browseBtn.onclick = goBrowse;
    app.appendChild(browseBtn);
    return;
  }

  const list = document.createElement('div');
  groupCartByBook().forEach(group=>{
    const lines = group.lines;
    const first = lines[0];
    const lineTotal = lines.reduce((sum,l) => sum + lineAmount(l), 0);

    const row = document.createElement('div');
    row.className = "cart-line";

    if(group.isSeriesGroup){
      // All books added together as a series share one signed/personalized
      // decision, so there's a single variant line for the whole group —
      // and a book-count badge instead of a per-copy qty stepper, since
      // "+"/"-" on a set of different books isn't a single-book action.
      const seriesCover = first.seriesCoverUrl || first.coverUrl;
      const bookTitles = lines.map(l => l.title).join(", ");
      row.innerHTML = `
        <div class="cart-line-cover">${seriesCover ? `<img src="${coverSrc(seriesCover)}" alt="">` : ""}</div>
        <div class="cart-line-info">
          <div class="cart-line-title">${escapeHtml(seriesLabel(first.seriesName || first.title))}${seriesSwagSuffix(lines, first)}</div>
          <div class="cart-line-author">by ${escapeHtml(first.author)}</div>
          <div class="cart-line-variants">
            <div class="cart-line-meta">${lines.length} book${lines.length===1?"":"s"}: ${escapeHtml(bookTitles)}</div>
            <div class="cart-line-meta">${escapeHtml(variantDescriptionPlain(Object.assign({}, first, {swag:false})))}</div>
          </div>
        </div>
        <div class="cart-line-right">
          <div class="cart-line-price">${money(lineTotal)}</div>
        </div>
      `;

      const removeAllLink = document.createElement('div');
      removeAllLink.className = "cart-line-remove";
      removeAllLink.textContent = "Remove series";
      removeAllLink.onclick = () => {
        openSeriesRemoveChoiceModal(group);
      };
      row.querySelector('.cart-line-info').appendChild(removeAllLink);

      list.appendChild(row);
      return;
    }

    // Different formats of the same book are already split into their own
    // group by groupCartByBook, so every variant line left to show here is
    // just a signed/personalization difference within that one format —
    // the format itself (when the book has more than one) is named once,
    // right under the title, instead of repeated on every variant line.
    const variantGroups = variantsForLines(lines);
    const allSwag = lines.every(l => l.swag);
    row.innerHTML = `
      <div class="cart-line-cover">${first.coverUrl ? `<img src="${coverSrc(first.coverUrl)}" alt="">` : ""}</div>
      <div class="cart-line-info">
        <div class="cart-line-title">${first.swagOnly ? "Swag pack - " + escapeHtml(first.title) : escapeHtml(first.title) + (allSwag ? " + Swag pack" : "")}</div>
        ${first.formatLabel ? `<div class="cart-line-meta" style="font-weight:700;color:var(--navy);">${escapeHtml(first.formatLabel)}</div>` : ""}
        <div class="cart-line-author">by ${escapeHtml(first.author)}</div>
        <div class="cart-line-variants"></div>
      </div>
      <div class="cart-line-right">
        <div class="cart-line-price">${money(lineTotal)}</div>
        <div class="qty-stepper cart-qty-stepper">
          <button type="button" class="cart-qty-minus">&minus;</button>
          <span class="qty-val">${lines.length}</span>
          <button type="button" class="cart-qty-plus">+</button>
        </div>
      </div>
    `;

    const variantsWrap = row.querySelector('.cart-line-variants');
    variantGroups.forEach(vLines=>{
      const countPrefix = vLines.length > 1 ? `${vLines.length}× ` : "";
      const d = document.createElement('div');
      d.className = "cart-line-meta";
      d.textContent = countPrefix + (vLines[0].swagOnly ? "Swag pack only" : vLines[0].signed && vLines[0].personalizedName ? `Signed — personalized to "${vLines[0].personalizedName}"` : (vLines[0].signed ? "Signed" : "Not signed")) + ((vLines[0].swag && !allSwag) ? " + Swag pack" : "");
      variantsWrap.appendChild(d);
    });

    const removeAllLink = document.createElement('div');
    removeAllLink.className = "cart-line-remove";
    removeAllLink.textContent = "Remove all";
    const lineIds = new Set(lines.map(l => l.cartLineId));
    removeAllLink.onclick = () => {
      cart = cart.filter(l => !lineIds.has(l.cartLineId));
      saveCartToStorage();
      render();
    };
    row.querySelector('.cart-line-info').appendChild(removeAllLink);

    row.querySelector('.cart-qty-plus').onclick = () => incrementBookInCart(group.bookId, group.format);
    row.querySelector('.cart-qty-minus').onclick = () => decrementBookInCart(group.bookId, group.format);

    list.appendChild(row);
  });
  app.appendChild(list);

  const totalRow = document.createElement('div');
  totalRow.className = "cart-total-row";
  const taxRow = document.createElement('div');
  taxRow.style.cssText = "display:flex;justify-content:space-between;font-size:14px;color:#6b7080;margin:0 0 6px;";
  taxRow.innerHTML = `<span>Books ${money(cartTotal())} + sales tax (${SALES_TAX_PCT}%)</span><span>${money(cartTax())}</span>`;
  totalRow.innerHTML = `<span>Total</span><span>${money(cartTotalWithTax())}</span>`;
  const finalNote = document.createElement('div');
  finalNote.style.cssText = "font-size:12px;color:#6b7080;margin:6px 0 14px;text-align:right;";
  finalNote.textContent = "All sales are final. No refunds.";
  app.appendChild(taxRow);
  app.appendChild(totalRow);
  app.appendChild(finalNote);

  const bar = document.createElement('div');
  bar.style.marginTop = "20px";
  const checkoutBtn = document.createElement('button');
  checkoutBtn.className = "btn btn-primary btn-block";
  checkoutBtn.textContent = "Checkout";
  checkoutBtn.onclick = goCheckout;
  bar.appendChild(checkoutBtn);
  const backLink = document.createElement('div');
  backLink.style.cssText = "text-align:center;margin-top:14px;font-family:'Montserrat',sans-serif;font-size:12.5px;color:var(--navy);opacity:.7;cursor:pointer;";
  backLink.textContent = "Keep browsing";
  backLink.onclick = goBrowse;
  bar.appendChild(backLink);
  app.appendChild(bar);
}

/* =========================================================
   CHECKOUT
========================================================= */
function bookAddButtonsHtml(book){
  const bl = cart.filter(l => l.bookId === book.id && !l.seriesGroupId);
  const swagInCart = cart.some(l => l.bookId === book.id + "::swag") || (bl.length > 0 && bl.every(l => l.swag));
  if(bookSwagOffered(book) && !swagInCart){
    return `<div class="book-btn-row"><button type="button" class="book-pick-btn book-pick-book"><span class="lbl-long">Add book to cart</span><span class="lbl-short">Add book</span></button><button type="button" class="book-pick-btn book-pick-both"><span class="lbl-long">Add book + Swag pack to cart</span><span class="lbl-short">Add book + swag</span></button><button type="button" class="book-pick-btn book-pick-swag"><span class="lbl-long">Swag pack only</span><span class="lbl-short">Swag only</span></button></div>`;
  }
  return book.isSeries
    ? `<div><button type="button" class="book-single-btn book-single-add">Add to cart</button></div>`
    : `<button type="button" class="book-add-btn">Add to cart</button>`;
}
function seriesSwagSuffix(lines, first){
  const n = lines.filter(l => l.swag).length;
  if(!n) return "";
  const offered = catalog.filter(b => b.isSeries && b.author === first.author && b.seriesName === first.seriesName && bookSwagOffered(b)).length;
  return n >= offered ? " + series swag pack" : ` + ${n} swag pack${n === 1 ? "" : "s"}`;
}
function seriesLabel(n){
  n = String(n||"").trim();
  return /\bseries\b/i.test(n) ? n : (n ? n + " series" : "Series");
}
function renderCheckout(app){
  const heading = document.createElement('div');
  heading.className = "modal-title";
  heading.style.marginBottom = "6px";
  heading.textContent = "Checkout";
  app.appendChild(heading);

  const sub = document.createElement('div');
  sub.className = "modal-sub";
  const cartGroups = groupCartByBook();
  const setCount = cartGroups.filter(g => g.isSeriesGroup).length;
  const bookCount = cartGroups.filter(g => !g.isSeriesGroup).reduce((n,g) => n + g.lines.length, 0);
  const parts = [];
  if(bookCount) parts.push(`${bookCount} book${bookCount===1?"":"s"}`);
  if(setCount) parts.push(`${setCount} series set${setCount===1?"":"s"}`);
  sub.textContent = `${parts.join(" and ")} — ${money(cartTotalWithTax())} total with ${SALES_TAX_PCT}% sales tax`;
  app.appendChild(sub);

  const form = document.createElement('div');
  form.innerHTML = `
    <div class="field"><label>First name <span class="req">*</span></label><input type="text" id="buyerFirst" autocomplete="given-name"></div>
    <div class="field"><label>Last name <span class="req">*</span></label><input type="text" id="buyerLast" autocomplete="family-name"></div>
    <div class="field"><label>Email address <span class="req">*</span></label><input type="email" id="buyerEmail" autocomplete="email"><div class="help">Your order confirmation will go here.</div></div>
  `;
  app.appendChild(form);

  const finalBox = document.createElement('label');
  finalBox.style.cssText = "display:flex;align-items:flex-start;gap:10px;margin:4px 0 16px;font-size:13.5px;line-height:1.4;cursor:pointer;";
  finalBox.innerHTML = `<input type="checkbox" id="salesFinal" style="width:18px;height:18px;margin-top:1px;accent-color:var(--terracotta);flex-shrink:0;"><span>I understand that all sales are final. No refunds.</span>`;
  app.appendChild(finalBox);

  const payBtn = document.createElement('button');
  payBtn.className = "btn btn-primary btn-block";
  payBtn.textContent = `Pay ${money(cartTotalWithTax())}`;
  payBtn.onclick = () => submitCheckout(payBtn);
  app.appendChild(payBtn);

  const backLink = document.createElement('div');
  backLink.style.cssText = "text-align:center;margin-top:14px;font-family:'Montserrat',sans-serif;font-size:12.5px;color:var(--navy);opacity:.7;cursor:pointer;";
  backLink.textContent = "Back to cart";
  backLink.onclick = goCart;
  app.appendChild(backLink);
}

async function submitCheckout(btn){
  const first = document.getElementById('buyerFirst').value.trim();
  const last = document.getElementById('buyerLast').value.trim();
  if(!first || !last){ showToast("Please enter your first and last name"); return; }
  if(!document.getElementById('salesFinal').checked){ showToast("Please check the box to confirm all sales are final"); return; }
  const name = first + " " + last;
  const email = document.getElementById('buyerEmail').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ showToast("Please enter a valid email address"); return; }
  if(cart.length === 0){ showToast("Your cart is empty"); return; }

  btn.disabled = true;
  showOverlay();
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "createCheckoutSession",
        buyerName: name,
        buyerEmail: email,
        lines: cart.reduce((out, l) => {
          const sp = (l.swag && parseFloat(l.swagPrice) > 0) ? parseFloat(l.swagPrice) : 0;
          if(l.swagOnly){
            // Swag pack by itself: its own line.
            out.push({ author: l.author, title: "Swag pack - " + l.title, unitPrice: l.swagPrice, signed: false, personalizedName: "",
              seriesGroupId: "", seriesName: "" });
          } else {
            // Swag bought with a book rides on that book's line: "Book + Swag pack".
            out.push({ author: l.author, title: l.title + (sp ? " + Swag pack" : ""), unitPrice: Math.round((parseFloat(l.unitPrice) + sp) * 100) / 100,
              signed: l.signed, personalizedName: l.personalizedName,
              seriesGroupId: (l.seriesGroupId && isSeriesGroupComplete(l.seriesGroupId)) ? l.seriesGroupId : "", seriesName: l.seriesName || "" });
          }
          return out;
        }, [])
      })
    });
    const json = await res.json();
    if(!json || !json.success) throw new Error((json && json.error) || "Checkout couldn't start.");
    window.location.href = json.url;
  }catch(e){
    hideOverlay();
    btn.disabled = false;
    showToast("Something went wrong — please try again");
  }
}

/* =========================================================
   SUCCESS / CANCELLED (Stripe redirects back here)
========================================================= */
/* =========================================================
   MY ORDERS (email-link access, no password)
========================================================= */
const ordersState = { orders:null, error:"", tried:false, loading:false, linkToken:"", sent:false };
function getDeviceToken(){ try{ return localStorage.getItem("bss_orders_token") || ""; }catch(e){ return ""; } }
function setDeviceToken(t){ try{ if(t) localStorage.setItem("bss_orders_token", t); else localStorage.removeItem("bss_orders_token"); }catch(e){} }

async function loadMyOrders(){
  const token = ordersState.linkToken || getDeviceToken();
  ordersState.tried = true;
  if(!token) return;
  ordersState.loading = true;
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"getBuyerOrders", token: token }) });
    const json = await res.json();
    if(json && json.success){
      ordersState.orders = json.orders || [];
      if(json.deviceToken) setDeviceToken(json.deviceToken);
    } else {
      if(json && json.expired){ setDeviceToken(""); ordersState.error = ordersState.linkToken ? "That link has expired. Enter your email below and we'll send you a fresh one." : ""; }
      else ordersState.error = "We couldn't load your orders. Please try again.";
    }
  }catch(e){ ordersState.error = "We couldn't reach the server. Please try again."; }
  ordersState.linkToken = "";
  ordersState.loading = false;
  if(currentScreen === "orders") render();
}

function renderOrders(app){
  renderOrdersInner(app);
  const cont = document.createElement('button');
  cont.className = "btn btn-primary btn-block";
  cont.style.marginTop = "16px";
  cont.textContent = "Continue browsing";
  cont.onclick = goBrowse;
  app.appendChild(cont);
}
function renderOrdersInner(app){
  const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const heading = document.createElement('div');
  heading.className = "modal-title";
  heading.style.marginBottom = "6px";
  heading.textContent = "My orders";
  app.appendChild(heading);

  if(!ordersState.tried && (ordersState.linkToken || getDeviceToken())) loadMyOrders();
  if(ordersState.loading || (!ordersState.tried && (ordersState.linkToken || getDeviceToken()))){
    const l = document.createElement('div'); l.className = "empty-state"; l.innerHTML = "Loading your orders&hellip;"; app.appendChild(l); return;
  }

  if(ordersState.orders){
    if(!ordersState.orders.length){
      const e = document.createElement('div'); e.className = "empty-state"; e.textContent = "No orders yet. When you order, they'll show up here."; app.appendChild(e);
    }
    ordersState.orders.forEach(o => {
      const card = document.createElement('div');
      card.style.cssText = "background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(12,30,61,0.08);";
      const d = o.createdAt ? new Date(o.createdAt).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"}) : "";
      let html = `<div style="display:flex;justify-content:space-between;gap:10px;font-family:'Montserrat',sans-serif;font-size:13px;"><b>${esc(d)}</b><b>${money(o.total)}</b></div>`;
      o.items.forEach(it => {
        const tags = [it.signed ? "Signed" : "Not signed"].concat(it.personalizedName ? ['Personalized to ' + esc(it.personalizedName)] : []).join(" · ");
        const books = (it.titles || []).map(t => { const m = /^(.*) \+ Swag pack$/.exec(String(t)); return m ? { title: m[1], swag: true } : { title: String(t), swag: false }; });
        const anySwag = books.some(b => b.swag);
        const heading = it.set ? seriesLabel(it.name) + (anySwag ? " + swag pack" : "") : (books.length ? books[0].title + (books[0].swag ? " + swag pack" : "") : String(it.name));
        html += `<div style="padding:10px 0;border-top:1px solid rgba(12,30,61,0.08);margin-top:10px;font-family:'Lora',serif;">`
          + `<div style="display:flex;justify-content:space-between;gap:10px;"><span><b>${esc(heading)}</b> <span style="font-size:12.5px;color:#6b7080;">by ${esc(it.author)}</span></span><span>${money(it.price)}</span></div>`
          + (it.set ? `<ul style="margin:4px 0 0 20px;padding:0;font-size:12.5px;color:#6b7080;">${books.map(b => `<li>${esc(b.title)}${b.swag ? " + swag" : ""}</li>`).join("")}</ul>` : "")
          + `<div style="font-size:12.5px;color:#6b7080;margin-top:3px;">${tags}</div></div>`;
      });
      card.innerHTML = html;
      app.appendChild(card);
    });
    const note = document.createElement('div');
    note.className = "modal-sub"; note.style.textAlign = "center";
    note.textContent = "Pick up your books at the authors table at the Soirée.";
    app.appendChild(note);
    const forget = document.createElement('div');
    forget.style.cssText = "text-align:center;font-family:'Montserrat',sans-serif;font-size:12px;opacity:.6;cursor:pointer;margin-top:6px;";
    forget.textContent = "Not you? Forget this device";
    forget.onclick = () => { setDeviceToken(""); ordersState.orders = null; ordersState.tried = false; ordersState.error = ""; render(); };
    app.appendChild(forget);
    return;
  }

  // no access yet: ask for the email
  const sub = document.createElement('div');
  sub.className = "modal-sub";
  sub.textContent = ordersState.sent
    ? "Check your email! If we found orders for that address, a link is on its way. This link will be active for 30 minutes."
    : (ordersState.error || "Enter the email you used to order and we'll email you a link to see your orders.");
  app.appendChild(sub);
  if(ordersState.sent) return;
  const form = document.createElement('div');
  form.innerHTML = `<div class="field"><label>Email address</label><input type="email" id="ordersEmail"></div>`;
  app.appendChild(form);
  const btn = document.createElement('button');
  btn.className = "btn btn-primary btn-block";
  btn.textContent = "Email me my link";
  btn.onclick = async () => {
    const email = document.getElementById('ordersEmail').value.trim();
    if(!email || email.indexOf("@") === -1){ showToast("Please enter a valid email"); return; }
    btn.disabled = true;
    try{
      await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"requestOrderHistory", email: email }) });
      ordersState.sent = true; ordersState.error = ""; render();
    }catch(e){ btn.disabled = false; showToast("Something went wrong — please try again"); }
  };
  app.appendChild(btn);
}

function renderProcessing(app){
  app.innerHTML = `
    <div style="text-align:center;padding:60px 10px;">
      <div class="save-overlay-spinner" style="margin:0 auto 22px;border-color:rgba(12,30,61,0.15);border-top-color:#E4593F;"></div>
      <div class="modal-title">Hold tight&mdash;we're processing your payment</div>
      <div class="modal-sub">This only takes a moment. Please keep this page open.</div>
    </div>
  `;
}
function renderSuccess(app){
  app.innerHTML = `
    <div style="text-align:center;padding:40px 10px;">
      <div class="modal-title">You're all set!</div>
      <div class="modal-sub">Thank you for your order — a confirmation is on its way to your email. Your books will be ready for you to pick up at the authors table at the Soirée. SEE YOU THERE!</div>
    </div>
  `;
  const btn = document.createElement('button');
  btn.className = "btn btn-primary";
  btn.textContent = "Keep browsing";
  btn.onclick = goBrowse;
  app.appendChild(btn);
  const ob = document.createElement('div');
  ob.style.cssText = "text-align:center;margin-top:16px;font-family:'Montserrat',sans-serif;font-size:13px;text-decoration:underline;cursor:pointer;color:var(--navy);";
  ob.textContent = "See my orders";
  ob.onclick = goOrders;
  app.appendChild(ob);
}
function renderCancelled(app){
  app.innerHTML = `
    <div style="text-align:center;padding:40px 10px;">
      <div class="modal-title">Checkout cancelled</div>
      <div class="modal-sub">No worries — your cart is still here whenever you're ready.</div>
    </div>
  `;
  const btn = document.createElement('button');
  btn.className = "btn btn-primary";
  btn.textContent = "Back to cart";
  btn.onclick = goCart;
  app.appendChild(btn);
}

async function confirmSuccessIfNeeded(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('checkout') === 'success'){
    const sessionId = params.get('session_id');
    currentScreen = "processing";
    cart = [];
    saveCartToStorage();
    render();
    if(sessionId){
      try{
        const cr = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "confirmCheckoutSession", sessionId: sessionId })
        });
        try{ const cj = await cr.json(); if(cj && cj.deviceToken) setDeviceToken(cj.deviceToken); }catch(e2){}
      }catch(e){ /* success page still shows; this just finalizes payout bookkeeping */ }
    }
    currentScreen = "success";
    render();
  } else if(params.get('checkout') === 'cancelled'){
    currentScreen = "cancelled";
  } else if(params.get('orders')){
    ordersState.linkToken = params.get('orders');
    currentScreen = "orders";
    try{ history.replaceState(null, "", window.location.pathname); }catch(e){}
  }
}

/* =========================================================
   INIT
========================================================= */
async function loadCatalog(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + "?action=getPreorderCatalog");
    const json = await res.json();
    catalog = (json && json.books) || [];
  }catch(e){
    catalog = [];
    showToast("Couldn't load the book list — please refresh");
  }
  catalogLoaded = true;
}

(async function init(){
  await confirmSuccessIfNeeded();
  await loadCatalog();
  render();
})();
